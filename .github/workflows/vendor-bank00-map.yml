name: Vendor Bank00 Map Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-bank00-map.yml'
      - '.gitmodules'
      - 'reference/**'
      - 'tools/vendor_map_source.py'

permissions:
  contents: write

jobs:
  vendor-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned references
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Vendor map sources
        run: python3 tools/vendor_map_source.py

      - name: Commit vendored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home/map.asm home/map_variants/
          if git diff --cached --quiet; then
            echo 'Vendored map source already current.'
            exit 0
          fi
          git commit -m 'Vendor pinned Bank 00 map sources locally'
          git push
